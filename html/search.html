<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELLA - Search</title>
  <!-- jQuery CDN -->
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Slick CSS & JS -->
  <script src="../js/slick/slick.js"></script>
  <link rel="stylesheet" href="../js/slick/slick-theme.css">
  <link rel="stylesheet" href="../js/slick/slick.css">
  <!-- Custom CSS & JS -->
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/custom.js"></script>
</head>
<body>
  <div class="container search">
    <div class="search-inner">
      <!-- Main Header include -->
      <div class="main-header-include"></div>
      <!-- Main Header include -->
      <div class="search-content">
        <div class="search-field">
          <input type="text" placeholder="검색어를 입력해주세요">
        </div>
        <div class="search-recent">
          <div class="title">
            <h3>최근 검색어</h3>
            <button class="btn-all-clear">전체삭제</button>
          </div>
          <div class="items">
            <div class="item">
              <span>여름 가디건</span>
              <button class="btn-clear"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="item">
              <span>린넨</span>
              <button class="btn-clear"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="item">
              <span>나시티</span>
              <button class="btn-clear"><i class="bi bi-x-lg"></i></button>
            </div>
          </div>
        </div>
        <div class="search-popular">
          <div class="title">
            <h3>인기 검색어</h3>
          </div>
          <ul class="search-popular-list">
            <li>원피스여름</li>
            <li>여름바지</li>
            <li>샌들여성</li>
            <li>여름블라우스</li>
            <li>양산</li>
            <li>나시티</li>
            <li>여름가디건</li>
          </ul>
        </div>
      </div>
      <!-- GNB include -->
      <div class="gnb-include"></div>
      <!-- GNB include -->
    </div>
  </div>
</body>
</html>
