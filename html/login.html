<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELLA - Login</title>
  <!-- jQuery CDN -->
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom CSS & JS -->
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/custom.js"></script>
</head>
<body>
  <div class="container login">
    <div class="login-inner">
      <div class="login-photo"></div>
      <div class="login-content">
        <div class="login-header">
          <h2 class="logo">Vella</h2>
          <p>로그인 후 이용하여 다양한 혜택을 만나보세요.</p>
        </div>
        <div class="input-field">
          <input type="text" placeholder="아이디 입력">
          <input type="password" placeholder="비밀번호 입력">
        </div>
        <div class="status custom-chk">
          <label>
            <input type="checkbox"><em></em>자동 로그인
          </label>
          <a href="#none">아이디/비밀번호 찾기</a>
        </div>
        <button class="btn-primary btn-login">로그인</button>
        <div class="join-member">
          아직 회원이 아니신가요?<a href="#none">회원가입</a>
        </div>
        <div class="easy-login">
          <span>SNS 계정으로 간편 로그인</span>
          <div>
            <a href="#none"><img src="../images/sns1.svg"></a>
            <a href="#none"><img src="../images/sns2.svg"></a>
            <a href="#none"><img src="../images/sns3.svg"></a>
            <a href="#none"><img src="../images/sns4.svg"></a>
            <a href="#none"><img src="../images/sns5.svg"></a>
          </div>
        </div>
      </div>
      <!-- GNB include -->
      <div class="gnb-include"></div>
      <!-- GNB include -->
    </div>
  </div>
</body>
</html>
