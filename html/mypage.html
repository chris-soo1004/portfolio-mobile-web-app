<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELLA - My Page</title>
  <!-- jQuery CDN -->
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Custom CSS & JS -->
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/custom.js"></script>
</head>
<body>
  <div class="container mypage">
    <div class="mypage-inner">
      <!-- Main Header include -->
      <div class="main-header-include"></div>
      <!-- Main Header include -->
      <div class="mypage-content">
        <div class="profile">
          <div class="user-photo">
            <img src="../images/09-mypage-photo.png">
          </div>
          <div class="user-info">
            <div class="grade-setting">
              <span>멤버십 등급<b>VIP</b></span>
              <i class="bi bi-gear-fill"></i>
            </div>
            <h3>뽀짝쿵크리스</h3>
          </div>
        </div>
        <div class="point-coupon-review">
          <div>
            <span>적립금</span>
            <b>5,000</b>
          </div>
          <div>
            <span>쿠폰</span>
            <b>2</b>
          </div>
          <div>
            <span>리뷰</span>
            <b>0</b>
          </div>
        </div>
        <div class="delivering-product">
          <h2>배송 중 상품</h2>
          <div class="delivering-product-items">
            <div class="delivering-product-item">
              <div class="thum">
                <img src="../images/05-Product-Detail-01.jpg">
              </div>
              <div class="desc">
                <p>[룸페커] 네트 크로쉐 썸머 니트 베스트</p>
                <b>배송완료</b>
              </div>
            </div>
            <div class="delivering-product-item">
              <div class="thum">
                <img src="../images/05-Product-Detail-02.jpg">
              </div>
              <div class="desc">
                <p>[프렌치시크] 엘린느 스트라이프 레이온 셔츠</p>
                <b>배송중(오늘 도착 예정)</b>
              </div>
            </div>
          </div>
        </div>
        <div class="banner">
          <a href="#none "><img src="../images/09-mypage-banner-01.jpg"></a>
        </div>
        <div class="user-shortcut">
          <a href="#none">
            <i class="bi bi-heart"></i><span>찜 목록</span>
          </a>
          <a href="#none">
            <i class="bi bi-arrow-repeat"></i><span>취소/교환/반품 내역</span>
          </a>
          <a href="#none">
            <i class="bi bi-cash-coin"></i><span>환불 계좌</span>
          </a>
          <a href="#none">
            <i class="bi bi-credit-card"></i><span>카드 간편결제</span>
          </a>
          <a href="#none">
            <i class="bi bi-chat-left-dots"></i><span>자주 묻는 질문</span>
          </a>
          <a href="#none">
            <i class="bi bi-chat-quote"></i><span>채팅 상담</span>
          </a>
          <a href="#none">
            <i class="bi bi-telephone-inbound"></i><span>전화 상담</span>
          </a>
          <a href="#none">
            <i class="bi bi-shop"></i><span>입점 문의</span>
          </a>
        </div>
        <button class="btn-primary btn-logout">로그아웃</button>
      </div>
      <!-- GNB include -->
      <div class="gnb-include"></div>
      <!-- GNB include -->
    </div>
  </div>
</body>
</html>
