<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELLA - Cart</title>
  <!-- jQuery CDN -->
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Slick CSS & JS -->
  <script src="../js/slick/slick.js"></script>
  <link rel="stylesheet" href="../js/slick/slick-theme.css">
  <link rel="stylesheet" href="../js/slick/slick.css">
  <!-- Custom CSS & JS -->
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/custom.js"></script>
</head>
<body>
  <div class="container cart">
    <div class="cart-inner">
      <!-- Main Header include -->
      <div class="main-header-include"></div>
      <!-- Main Header include -->
      <div class="cart-content">
        <!-- <div class="cart-title">
          <h3>장바구니</h3>
          <button class="btn-all-clear">전체삭제</button>
        </div> -->
        <div class="cart-title">
          <h3>장바구니</h3>
          <div class="cart-items-check-all">
            <span>
              <input type="checkbox" class="cart-chk-all" checked>전체선택 <b>2</b>/2
            </span>
            <button class="btn-all-clear">전체삭제</button>
          </div>
        </div>
        <div class="cart-items">
          <div class="cart-item">
            <div class="cart-item-title">
              <label>
                <input type="checkbox" class="cart-chk" checked><em></em>[룸페커] 네트 크로쉐 썸머 니트 베스트
              </label>
              <button class="btn-clear"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="cart-item-desc">
              <div class="thum">
                <img src="../images/05-Product-Detail-01.jpg">
              </div>
              <div class="price-option">
                <s>84,000원</s>
                <div>
                  <span>64%</span>
                  <b>29,725원</b>
                </div>
                <em>블루 / FREE</em>
                <select>
                  <option value="">1</option>
                </select>
              </div>
            </div>
            <div class="cart-item-coupon">
              <b>쿠폰 할인</b>
              <span>적용 가능 쿠폰 없음</span>
            </div>
          </div>
          <div class="cart-item">
            <div class="cart-item-title">
              <label>
                <input type="checkbox" class="cart-chk" checked><em></em>[프렌치시크] 엘린느 스트라이프 레이온 셔츠
              </label>
              <button class="btn-clear"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="cart-item-desc">
              <div class="thum">
                <img src="../images/05-Product-Detail-02.jpg">
              </div>
              <div class="price-option">
                <s>53,800원</s>
                <div>
                  <span>52%</span>
                  <b>25,330원</b>
                </div>
                <em>화이트 / M</em>
                <select>
                  <option value="">1</option>
                </select>
              </div>
            </div>
            <div class="cart-item-coupon">
              <b>쿠폰 할인</b>
              <span>적용 가능 쿠폰 없음</span>
            </div>
          </div>
        </div>
        <div class="cart-price">
          <div>
            <span>총 상품가격</span>
            <b>137,800원</b>
          </div>
          <div>
            <span>총 할인금액</span>
            <b>-82,745원</b>
          </div>
          <div>
            <span>총 배송비</span>
            <b>0원</b>
          </div>
          <div>
            <span>총 결제 예상 금액</span>
            <b>55,055원</b>
          </div>
        </div>
        <button class="btn-primary btn-cart-order">55,055원 구매하기</button>
        <!-- Cart Item Empty -->
        <div class="cart-item-empty">
          <img src="../images/cart-item-empty.png">
        </div>
        <!-- Cart Item Empty -->
        <div class="cart-notice">
          <span>장바구니에 담긴 상품은 90일간 보관됩니다.</span>
          <span>실 결제금액은 쿠폰 및 할인 적용에 따라 달라질 수 있습니다.</span>
          <span>쿠폰 및 할인 적용에 따라 대체될 수 있습니다.</span>
        </div>
      </div>
      <!-- GNB include -->
      <div class="gnb-include"></div>
      <!-- GNB include -->
    </div>
  </div>
</body>
</html>
